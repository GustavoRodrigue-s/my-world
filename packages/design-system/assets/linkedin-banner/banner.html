<!doctype html>
<!--
  LinkedIn profile banner: 792 × 198 CSS px, the size LinkedIn shows it on desktop,
  so the type tokens are true to size. Rendered at 2x = 1584 × 396, LinkedIn's format.

  Every color, type and space value comes from the generated token CSS. The drawing
  is Fig. 1 (apps/web/src/components/portfolio/world-figure.tsx) in its still frame,
  recomposed for 4:1. Its own geometry is the only literal here (ADR 0021).

  Options: ?locale=pt|en  ?theme=light|dark  ?guide=1 (shows the profile photo's area)
  To render: ./render.sh
-->
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <title>LinkedIn banner</title>
    <link rel="stylesheet" href="../../generated/css/tokens.css" />
    <link rel="stylesheet" href="../../generated/css/portfolio.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Cormorant+Garamond:ital,wght@1,400&family=IBM+Plex+Mono:wght@400;500&display=block"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { background: var(--color-surface); }

      .plate {
        position: relative;
        width: 792px;
        height: 198px;
        overflow: hidden;
        color: var(--color-foreground);
        background: var(--color-surface);
      }
      .drawing { position: absolute; inset: 0; width: 100%; height: 100%; }

      /* Top left, above the profile photo. */
      .brand {
        position: absolute;
        top: var(--space-5);
        left: var(--space-5);
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      .brand svg { width: var(--size-icon-2xl); height: var(--size-icon-2xl); }
      .brand-name {
        font: var(--font-weight-semibold) var(--font-size-sm) / var(--font-line-height-tight) var(--font-family-sans);
        letter-spacing: var(--font-letter-spacing-tight);
      }
      .brand-sub {
        font: var(--font-weight-regular) var(--font-size-2xs) / var(--font-line-height-tight) var(--font-family-mono);
        color: var(--color-foreground-muted);
      }

      /* The statement, clear of the photo on desktop and in the app. */
      .copy {
        position: absolute;
        top: 0;
        bottom: 0;
        left: calc(var(--space-60) + var(--space-2));
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: var(--space-3);
      }
      .rubric, .stack {
        font: var(--font-weight-regular) var(--font-size-xs) / var(--font-line-height-tight) var(--font-family-mono);
        color: var(--color-foreground-muted);
        white-space: nowrap;
      }
      .rubric b { font-weight: var(--font-weight-regular); color: var(--color-primary); }
      .statement {
        font: var(--font-weight-semibold) var(--font-size-3xl) / var(--font-line-height-none) var(--font-family-sans);
        letter-spacing: var(--font-letter-spacing-tighter);
        white-space: nowrap;
      }
      /* The English line is longer: one step down keeps it clear of the planet. */
      :root[lang='en'] .statement { font-size: var(--font-size-2xl); }
      .statement em {
        font-family: var(--font-family-serif);
        font-style: italic;
        font-weight: var(--font-weight-regular);
        font-size: var(--font-scale-emphasis);
        letter-spacing: var(--font-letter-spacing-normal);
        line-height: 0;
        color: var(--color-primary);
      }
      .stack {
        width: fit-content;
        padding-top: var(--space-2);
        border-top: var(--border-width-hairline) solid var(--color-border-strong);
      }

      .ink { stroke: var(--color-foreground); fill: none; }
      .ink-fill { fill: var(--color-foreground); }
      .paper { fill: var(--color-surface); }
      .red { fill: var(--color-primary); }
      .red-line { stroke: var(--color-primary); fill: none; }

      /* Where LinkedIn lays the photo over the banner: desktop (solid), phone (dashed). */
      .guide { display: none; }
      [data-guide] .guide { display: block; }
    </style>
  </head>
  <body data-env="portfolio">
    <main class="plate">
      <svg class="drawing" viewBox="0 0 792 198" aria-hidden="true">
        <defs>
          <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
            <line x1="0" y1="0" x2="0" y2="7" class="ink" stroke-width="1.2" />
          </pattern>
          <mask id="night">
            <circle cx="300" cy="330" r="128" fill="white" />
            <circle cx="352" cy="286" r="133" fill="black" />
          </mask>
          <clipPath id="planet"><circle cx="300" cy="330" r="128" /></clipPath>
        </defs>

        <!-- Registration marks -->
        <path d="M6 18V6H18M774 6H786V18M786 180V192H774M18 192H6V180" class="ink" stroke-width="1" opacity="0.5" />

        <!-- Fig. 1, in the figure's own coordinates -->
        <g transform="translate(548 -42) scale(0.5)">
          <!-- Sky -->
          <g class="ink" stroke-width="1.3" opacity="0.45">
            <path d="M236 128h6m-3-3v6M396 126h6m-3-3v6M470 150h6m-3-3v6M494 212h6m-3-3v6M402 182h6m-3-3v6" />
          </g>

          <!-- Cruzeiro do Sul -->
          <g transform="translate(54 58)">
            <path d="M112 64L116 148M82 102L142 92" class="ink" stroke-width="1.1" stroke-dasharray="2 5" opacity="0.5" />
            <path class="ink-fill" d="M112 56.5l2 6 5.5 1.5-5.5 2-2 5.5-2-5.5-5.5-2 5.5-1.5zM82 95l2.2 5.5 5.8 1.5-5.8 2-2.2 6-2-6-6-2 6-1.5zM142 86.5l1.5 4.5 4.5 1-4.5 1.5-1.5 4.5-1.5-4.5-4.5-1.5 4.5-1zM130 122l1 3 3 1-3 1-1 3-1-3-3-1 3-1zM116 139l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z" />
          </g>

          <!-- Far side of the orbits -->
          <g transform="rotate(-14 300 330)">
            <path d="M570 330A270 72 0 0 0 30 330" class="ink" stroke-width="1.3" stroke-dasharray="2 6" opacity="0.6" />
            <path d="M514 330A214 52 0 0 0 86 330" class="ink" stroke-width="1.3" stroke-dasharray="2 6" opacity="0.6" />
          </g>

          <!-- Planet -->
          <circle cx="300" cy="330" r="128" class="paper" />
          <rect x="172" y="202" width="256" height="256" fill="url(#hatch)" mask="url(#night)" opacity="0.6" />
          <g clip-path="url(#planet)" transform="rotate(-14 300 330)" class="ink" stroke-width="1.2" opacity="0.32">
            <path d="M172 330A128 30.72 0 0 0 428 330" />
            <path d="M193.76 258.32A106.24 25.6 0 0 0 406.24 258.32" />
            <path d="M193.76 401.68A106.24 25.6 0 0 0 406.24 401.68" />
            <path d="M300 202V458" />
            <path d="M300 202A89.6 128 0 0 1 300 458" />
            <path d="M300 202A89.6 128 0 0 0 300 458" />
          </g>
          <circle cx="300" cy="330" r="128" class="ink" stroke-width="2.2" />

          <!-- Tesouro escondido -->
          <g transform="rotate(-34 300 330) translate(300 202) scale(1.5)" stroke-width="1.1" stroke-linejoin="round">
            <path d="M-8 3V-14H8V3Z" class="paper" />
            <path d="M-8 3V-14H8V3M-10.5 -13L0 -24L10.5 -13M0 -24V-33M-3.5 -29.5H3.5M-2.5 0V-5.5A2.5 2.5 0 0 1 2.5 -5.5V0" class="ink" />
          </g>

          <!-- Antenna -->
          <g transform="rotate(-62 300 330) translate(300 202) scale(1.3)" stroke-width="1.2" stroke-linejoin="round">
            <path d="M-6 3L0 -28L6 3M-4.4 -6H4.4M-2.7 -15H2.7M-1.2 -22H1.2" class="ink" />
          </g>

          <!-- Oficina, the forge lit -->
          <g transform="translate(300 202) scale(1.3)" stroke-width="1.3" stroke-linejoin="round">
            <path d="M8 -27V-40H13V-23M-18 3V-22H18V3Z" class="paper" />
            <path d="M8 -27V-40H13V-24M-18 3V-22H18V3M-21 -21L0 -37L21 -21" class="ink" />
            <circle cx="-9.5" cy="-12.5" r="3.4" class="ink" />
            <path d="M-1 3V-9A5 5 0 0 1 9 -9V3Z" class="red" />
          </g>

          <!-- Gear -->
          <g transform="rotate(32 300 330) translate(300 202) scale(1.3)">
            <path d="M0 3V-11" class="ink" stroke-width="1.2" />
            <g transform="translate(0 -23)">
              <circle r="10.5" class="paper ink" style="fill: var(--color-surface)" stroke-width="3.4" stroke-dasharray="3.7 3.63" />
              <circle r="9" class="ink" stroke-width="1.2" />
              <circle r="3" class="ink" stroke-width="1.2" />
            </g>
          </g>

          <!-- Pine -->
          <g transform="rotate(56 300 330) translate(300 202) scale(1.3)" stroke-width="1.2" stroke-linejoin="round">
            <path d="M0 3V-5" class="ink" />
            <path d="M-8 -4L0 -17L8 -4ZM-6 -13L0 -26L6 -13Z" class="ink" style="fill: var(--color-surface)" />
          </g>

          <!-- Near side of the orbits, with the artifacts -->
          <g transform="rotate(-14 300 330)">
            <path d="M30 330A270 72 0 0 0 570 330" class="ink" stroke-width="1.5" />
            <path d="M86 330A214 52 0 0 0 514 330" class="ink" stroke-width="1.5" />
            <g transform="translate(150 366)">
              <path d="M-14 0H-6M6 0H14" class="ink" stroke-width="1.4" /><rect x="-5" y="-5" width="10" height="10" class="ink-fill" />
            </g>
            <g transform="translate(330 381)">
              <path d="M-14 0H-6M6 0H14" class="ink" stroke-width="1.4" /><rect x="-5" y="-5" width="10" height="10" class="ink-fill" />
            </g>
            <g transform="translate(200 397)">
              <path d="M-14 0H-6M6 0H14" class="ink" stroke-width="1.4" /><rect x="-5" y="-5" width="10" height="10" class="paper ink" style="fill: var(--color-surface)" stroke-width="1.4" />
            </g>
            <g transform="translate(438 370)">
              <path d="M-14 0H-6M6 0H14" class="ink" stroke-width="1.4" /><rect x="-5" y="-5" width="10" height="10" class="red" />
            </g>
          </g>

          <!-- The spark falling from the Cross into the chimney -->
          <path d="M170 210C214 176 262 142 313 146" class="red-line" stroke-width="1.3" stroke-dasharray="2 5" />
          <circle cx="290" cy="146" r="4.5" class="red" />
        </g>

        <g class="guide">
          <circle cx="100" cy="166" r="76" fill="none" stroke="var(--color-support)" stroke-width="1" />
          <circle cx="128" cy="204" r="104" fill="none" stroke="var(--color-support)" stroke-width="1" stroke-dasharray="4 4" />
        </g>
      </svg>

      <header class="brand">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M37.02 13.07 A17 17 0 1 0 41 24 H31.5" class="ink" stroke-width="3.2" />
          <circle cx="24" cy="24" r="4.4" class="ink-fill" />
          <path d="M37.27 18.19a2.7 2.7 0 1 0 5.4 0a2.7 2.7 0 1 0 -5.4 0Z" class="red" />
        </svg>
        <div>
          <p class="brand-name">Gustavo Rodrigues</p>
          <p class="brand-sub" data-copy="world"></p>
        </div>
      </header>

      <section class="copy">
        <p class="rubric"><b>¶</b> <span data-copy="kicker"></span></p>
        <h1 class="statement" data-copy="statement"></h1>
        <p class="stack" data-copy="stack"></p>
      </section>
    </main>

    <script>
      // The same strings as lib/portfolio-content-{pt,en}.ts. One emphasized word.
      const COPY = {
        pt: {
          world: 'mundo do gustavo',
          kicker: 'Engenheiro de Software e IA',
          statement: 'Software feito com <em>capricho</em>,<br />da interface ao servidor.',
          stack: 'React · Next.js · TypeScript · NestJS · IA',
        },
        en: {
          world: 'mundo do gustavo',
          kicker: 'Software and AI Engineer',
          statement: 'Software made with <em>care</em>,<br />from the interface to the server.',
          stack: 'React · Next.js · TypeScript · NestJS · AI',
        },
      }
      const params = new URLSearchParams(location.search)
      const locale = params.get('locale') === 'en' ? 'en' : 'pt'
      document.documentElement.lang = locale
      document.documentElement.dataset.theme = params.get('theme') === 'dark' ? 'dark' : 'light'
      if (params.has('guide')) document.body.dataset.guide = ''
      document.querySelectorAll('[data-copy]').forEach((el) => {
        el.innerHTML = COPY[locale][el.dataset.copy]
      })
    </script>
  </body>
</html>
